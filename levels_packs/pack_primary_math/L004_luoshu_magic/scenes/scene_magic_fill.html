<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Georgia,"Songti SC",serif;background:linear-gradient(135deg,#1a1a2e,#2d2d44);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:rgba(245,230,200,.95);border:3px solid #c9a96e;border-radius:12px;padding:28px 32px;max-width:520px;width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .title{text-align:center;font-size:20px;color:#6b4e1e;margin-bottom:8px;font-weight:bold;}
  .subtitle{text-align:center;font-size:14px;color:#8b6914;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);gap:4px;
    justify-content:center;margin:16px 0;}
  .cell{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;
    background:rgba(255,255,255,.6);border:2px solid #c9a96e;border-radius:6px;color:#4a3a1a;}
  .cell input{width:100%;height:100%;border:none;text-align:center;font-size:24px;font-weight:bold;
    background:transparent;color:#a63a3a;outline:none;}
  .cell input:focus{background:rgba(201,169,110,.2);}
  .input-row{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;}
  button{padding:10px 28px;font-size:16px;background:linear-gradient(135deg,#8b6914,#a67c00);
    color:#fdf6e3;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}
  button:hover{filter:brightness(1.1);}
  .feedback{text-align:center;margin-top:14px;min-height:24px;font-size:15px;font-weight:bold;}
  .ok{color:#2a7a2a;}
  .err{color:#a63a3a;}
</style></head><body>
  <div class="card">
    <div class="title">第一重封印 · 缺数之阵</div>
    <div class="subtitle">幻和 = 15（每行、每列、每条对角线三数之和均为15）</div>
    <div class="grid" id="grid">
      <div class="cell"><input type="number" id="c00" min="1" max="9"></div>
      <div class="cell">1</div>
      <div class="cell">6</div>
      <div class="cell">3</div>
      <div class="cell">5</div>
      <div class="cell">7</div>
      <div class="cell">4</div>
      <div class="cell">9</div>
      <div class="cell"><input type="number" id="c22" min="1" max="9"></div>
    </div>
    <div class="input-row">
      <button id="submit">提交</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
<script>
  const fb = document.getElementById('feedback');
  function check(){
    const v00 = parseInt(document.getElementById('c00').value);
    const v22 = parseInt(document.getElementById('c22').value);
    if(isNaN(v00)||isNaN(v22)){ fb.textContent='请把两个空格都填上数字'; fb.className='feedback err'; return; }
    if(v00===8 && v22===2){
      fb.textContent='正确！第一重封印解除。'; fb.className='feedback ok';
      setTimeout(()=>parent.postMessage({protocol:'mathtown-puzzle',action:'complete',puzzleId:'magic_fill'},'*'),800);
    } else {
      fb.textContent='不对哦。想想幻和是15，用15减去一行里已知的两个数。'; fb.className='feedback err';
    }
  }
  document.getElementById('submit').onclick = check;
  document.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  });
</script>
</body></html>
